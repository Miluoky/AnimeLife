<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Зеркала ведут на основной адрес. Переходы по страницам Worker не видит (они отдаются без него ради лимита
      // вызовов), поэтому перенаправляем здесь. Поисковикам Worker отвечает настоящим 301 (worker/index.js).
      if (/^(www\.animelife\.top|anime\.artemdrr61f9\.workers\.dev)$/.test(location.hostname))
        location.replace('https://animelife.top' + location.pathname + location.search + location.hash)
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Смотреть аниме онлайн бесплатно с русской озвучкой | Anime Life</title>
    <meta name="description" content="Аниме онлайн бесплатно с русской озвучкой: онгоинги, каталог по жанрам и годам, расписание новых серий и «Мой список» с синхронизацией." />
    <!-- Крупные превью картинок в выдаче. Для страниц вне поиска Worker меняет значение на noindex. -->
    <meta name="robots" content="max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta property="og:site_name" content="Anime Life" />
    <meta property="og:title" content="Смотреть аниме онлайн бесплатно с русской озвучкой | Anime Life" />
    <meta property="og:type" content="website" />
    <meta property="og:description" content="Аниме онлайн бесплатно с русской озвучкой: онгоинги, каталог по жанрам и годам, расписание новых серий и «Мой список» с синхронизацией." />
    <meta property="og:url" content="https://animelife.top/" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:image" content="https://animelife.top/og-image.png" />
    <!-- Основной адрес сайта. Worker (worker/index.js) и приложение (src/data/pageMeta.ts) подставляют сюда текущую страницу. -->
    <link rel="canonical" href="https://animelife.top/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="application-name" content="Anime Life" />
    <meta name="theme-color" content="#0A0A0C" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="search" type="application/opensearchdescription+xml" title="Anime Life" href="/opensearch.xml" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Anime Life" />
    <link rel="preconnect" href="https://shikimori.io" />
    <!-- Данные Shikimori браузер берёт напрямую (CORS, без cookie): для таких запросов нужно отдельное соединение. -->
    <link rel="preconnect" href="https://shikimori.io" crossorigin />
    <link rel="preconnect" href="https://fra.cloud.appwrite.io" />
  </head>
  <body>
    <script>
      // Оформление (тема, акцент) применяется до первой отрисовки, чтобы страница не мигала. См. src/data/theme.ts.
      try {
        var a = JSON.parse(localStorage.getItem('anime.appearance') || '{}')
        var d = document.documentElement.dataset
        d.theme = a.theme || 'night'
        d.accent = a.accent || 'rose'
        d.calm = a.calm ? '1' : ''
        // Слабый телефон или экономия трафика: без тяжёлых эффектов (размытый свет постера, плавающий фон).
        var n = navigator
        // «Экономия трафика» в профиле: всегда, никогда или сама на медленной сети (см. src/data/saver.ts).
        var slow = n.connection && (n.connection.saveData || /(^|-)2g$/.test(n.connection.effectiveType || ''))
        if (a.saver === 'on' || (a.saver !== 'off' && (slow || (n.deviceMemory && n.deviceMemory <= 2)))) d.lite = '1'
        if (a.theme === 'oled') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#000000')
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
