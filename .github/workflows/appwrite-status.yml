name: Состояние функций Appwrite (выкл.)

# Prod на AnimeLife Core. Опрос Appwrite Functions больше не нужен — заглушка.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Введите RETIRED — workflow ничего не проверяет'
        required: true

permissions:
  contents: read

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Appwrite status retired
        run: |
          echo "::notice::Сайт на Core (/api/core). Статус функций Appwrite не опрашиваем."
          if [ "${{ inputs.confirm }}" != "RETIRED" ]; then
            echo "::error::Для подтверждения введите RETIRED."
            exit 1
          fi
