name: Состояние функций Appwrite

# Только читает: все функции, включены ли, активная сборка, расписание, последние ошибки. Ничего не меняет.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['scripts/appwrite-status.mjs', '.github/workflows/appwrite-status.yml']

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    env:
      APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/appwrite-status.mjs
