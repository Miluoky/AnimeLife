name: Проверки

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка, типы, размер
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Типы и сборка
        run: npm run build
      - name: Бюджет размера
        run: node scripts/check-size.mjs
      - name: Тесты community API
        run: npm run test:community
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  e2e:
    name: Браузерные тесты
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results
          retention-days: 7

  lighthouse:
    name: Lighthouse (телефон)
    runs-on: ubuntu-latest
    needs: build
    # Замер ходит в живой Shikimori и может плавать, поэтому не роняет проверку: цифры смотрим в логе.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Поднять сайт
        run: (npm run preview -- --port 4173 --strictPort &) && npx --yes wait-on http://localhost:4173
      - name: Замер
        run: |
          npx --yes lighthouse http://localhost:4173/ --preset=perf --form-factor=mobile --screenEmulation.mobile \
            --chrome-flags="--headless=new --no-sandbox" --output=json --output-path=./lighthouse.json --quiet
          node -e "
            const r = require('./lighthouse.json');
            const a = r.audits;
            console.log('Производительность:', Math.round(r.categories.performance.score * 100));
            console.log('LCP:', a['largest-contentful-paint'].displayValue, '| CLS:', a['cumulative-layout-shift'].displayValue, '| TBT:', a['total-blocking-time'].displayValue);
          "
      - uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: lighthouse.json
          retention-days: 7
