name: Выгрузка Appwrite (выкл.)

# Миграция в Core завершена. Экспорт plain-бэкапов больше не запускаем автоматически.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Введите RETIRED — workflow ничего не выгружает'
        required: true

permissions:
  contents: read

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Appwrite export retired
        run: |
          echo "::notice::База живёт в D1 (Core). Экспорт Appwrite отключён."
          if [ "${{ inputs.confirm }}" != "RETIRED" ]; then
            echo "::error::Для подтверждения введите RETIRED."
            exit 1
          fi
