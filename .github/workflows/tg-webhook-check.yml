name: tg-webhook-check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: webhook should be empty (getUpdates mode)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/deleteWebhook" --data 'drop_pending_updates=false'; echo
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo"; echo
          curl -fsS -X POST 'https://animelife.top/api/core/auth/oauth' \
            -H 'Content-Type: application/json' \
            -d '{"provider":"telegram-start"}'; echo
