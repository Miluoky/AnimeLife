name: Новости в Telegram-канал

# Автоновости канала Anime Life (scripts/telegram-news.mjs): новые серии онгоингов, анонсы сезона и обновления
# сайта из «Что нового». Публикует бот @AnimeLifeAuth_bot, он должен быть администратором канала.
# Канал: переменная репозитория TELEGRAM_CHANNEL (или значение ниже). Токен: секрет TELEGRAM_BOT_TOKEN,
# без него скрипт пробует взять токен у функции входа в Appwrite (секрет APPWRITE_API_KEY).
# Что уже опубликовано, переносится между запусками кэшем GitHub Actions (.tg-news/state.json).
on:
  schedule:
    - cron: '7,37 * * * *'
  push:
    branches: [main]
    paths: ['src/data/changelog.ts']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-news
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL || '' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
    steps:
      - name: Проверить канал
        id: check
        run: |
          if [ -n "$TELEGRAM_CHANNEL" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Канал не задан (TELEGRAM_CHANNEL), автоновости выключены."
          fi
      - if: steps.check.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/telegram-news.mjs
            src/data/changelog.ts
          sparse-checkout-cone-mode: false
      - if: steps.check.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.check.outputs.ok == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .tg-news
          key: tg-news-${{ github.run_id }}
          restore-keys: tg-news-
      - if: steps.check.outputs.ok == 'true'
        name: Опубликовать новости
        run: node scripts/telegram-news.mjs
      - if: always() && steps.check.outputs.ok == 'true' && hashFiles('.tg-news/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .tg-news
          key: tg-news-${{ github.run_id }}-${{ github.run_attempt }}
