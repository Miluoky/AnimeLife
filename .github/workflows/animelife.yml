name: Публикация на animelife.top

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: animelife
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Аккаунт Cloudflare, где живёт домен animelife.top (выдан регистратором).
      CLOUDFLARE_ACCOUNT_ID: e5e2946534888354d25b918e204bb745
      CLOUDFLARE_EMAIL: ${{ secrets.ANIMELIFE_CF_EMAIL }}
      CLOUDFLARE_API_KEY: ${{ secrets.ANIMELIFE_CF_API_KEY }}
    steps:
      # Пока ключ не добавлен в секреты репозитория, публикация просто пропускается.
      - name: Проверить ключ Cloudflare
        id: keys
        run: |
          if [ -n "$CLOUDFLARE_EMAIL" ] && [ -n "$CLOUDFLARE_API_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Секреты ANIMELIFE_CF_EMAIL и ANIMELIFE_CF_API_KEY не заданы, публикация на animelife.top пропущена."
          fi
      - if: steps.keys.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.keys.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - if: steps.keys.outputs.ok == 'true'
        run: npm ci
      - if: steps.keys.outputs.ok == 'true'
        run: npm run build
        env:
          VITE_BACKEND: core
          VITE_KODIK_TOKEN: ${{ secrets.VITE_KODIK_TOKEN }}
          VITE_SHIKIMORI_CLIENT_ID: ${{ vars.SHIKIMORI_CLIENT_ID || 'UYiG8nr9OhwMD8EypNgxTjYTiAxJ5gXuWZcokFkR_j4' }}
          # Новый домен плееров Kodik, если старый заблокируют (Settings → Variables → KODIK_DOMAIN).
          VITE_KODIK_DOMAIN: ${{ vars.KODIK_DOMAIN }}
          VITE_ALLOHA_TOKEN: ${{ secrets.VITE_ALLOHA_TOKEN }}
      - if: steps.keys.outputs.ok == 'true'
        name: Выложить Worker с сайтом
        run: npx --yes wrangler@4 deploy -c wrangler.animelife.jsonc
      # Секреты Core для входа/уведомлений Telegram (раньше жили в Appwrite Function social-login).
      - if: steps.keys.outputs.ok == 'true'
        name: Секреты Telegram на Worker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::warning::Секрет TELEGRAM_BOT_TOKEN не задан — вход через Telegram останется выключенным."
            exit 0
          fi
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx --yes wrangler@4 secret put TELEGRAM_BOT_TOKEN -c wrangler.animelife.jsonc
          printf '%s' "AnimeLifeAuth_bot" | npx --yes wrangler@4 secret put TELEGRAM_BOT_USERNAME -c wrangler.animelife.jsonc
          printf '%s' "https://animelife.top" | npx --yes wrangler@4 secret put SITE_URL -c wrangler.animelife.jsonc
          WH="$TELEGRAM_WEBHOOK_SECRET"
          if [ -z "$WH" ]; then
            WH=$(printf '%s' "animelife-tg-hook:$TELEGRAM_BOT_TOKEN" | sha256sum | awk '{print $1}')
          fi
          printf '%s' "$WH" | npx --yes wrangler@4 secret put TELEGRAM_WEBHOOK_SECRET -c wrangler.animelife.jsonc
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            -H 'Content-Type: application/json' \
            --data "{\"url\":\"https://animelife.top/api/core/auth/oauth/telegram/webhook\",\"secret_token\":\"${WH}\",\"allowed_updates\":[\"message\",\"callback_query\"]}"
      # IndexNow: сразу сообщить Яндексу и Bing об обновлённых разделах, посадочных страницах и онгоингах
      # (scripts/indexnow.mjs). Это ускоряет обход, но не обязательно: ошибка здесь публикацию не ломает.
      - if: steps.keys.outputs.ok == 'true'
        name: Сообщить поисковикам (IndexNow)
        continue-on-error: true
        timeout-minutes: 3
        run: node scripts/indexnow.mjs
