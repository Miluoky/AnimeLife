name: Копия базы

# Раз в сутки экспорт D1 anime_core (Core). Шифруется AES-256: предпочтителен секрет D1_BACKUP_PASSPHRASE
# (отдельно от глобального Cloudflare API Key), иначе — ANIMELIFE_CF_API_KEY. Артефакт 30 дней.
#
# Расшифровать (см. docs/worker-limit.md):
#   export BACKUP_PASS='…'   # D1_BACKUP_PASSPHRASE
#   openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in animelife-d1-backup.sql.enc -pass env:BACKUP_PASS -out anime_core.sql
on:
  schedule:
    - cron: '41 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: e5e2946534888354d25b918e204bb745
      CLOUDFLARE_EMAIL: ${{ secrets.ANIMELIFE_CF_EMAIL }}
      CLOUDFLARE_API_KEY: ${{ secrets.ANIMELIFE_CF_API_KEY }}
    steps:
      - name: Проверить ключ Cloudflare
        run: |
          if [ -z "$CLOUDFLARE_EMAIL" ] || [ -z "$CLOUDFLARE_API_KEY" ]; then
            echo "::error::Нет ANIMELIFE_CF_EMAIL / ANIMELIFE_CF_API_KEY — копию D1 сделать нечем."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            wrangler.animelife.jsonc
            worker/core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Экспорт D1
        run: |
          npx --yes wrangler@4 d1 export anime_core --remote --output=anime_core.sql -c wrangler.animelife.jsonc
          ls -lh anime_core.sql
      - name: Зашифровать
        env:
          D1_BACKUP_PASSPHRASE: ${{ secrets.D1_BACKUP_PASSPHRASE }}
        run: |
          export BACKUP_PASS="${D1_BACKUP_PASSPHRASE:-$CLOUDFLARE_API_KEY}"
          if [ -z "$BACKUP_PASS" ]; then
            echo "::error::Задайте секрет D1_BACKUP_PASSPHRASE или ANIMELIFE_CF_API_KEY."
            exit 1
          fi
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:BACKUP_PASS -in anime_core.sql -out animelife-d1-backup.sql.enc
          rm -f anime_core.sql
          ls -lh animelife-d1-backup.sql.enc
      - uses: actions/upload-artifact@v4
        with:
          name: animelife-d1-backup-${{ github.run_id }}
          path: animelife-d1-backup.sql.enc
          retention-days: 30
          compression-level: 0
