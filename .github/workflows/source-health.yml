name: Проверка источников

# Раз в час проверяет сайт и источники видео (scripts/source-health.mjs). Если что-то упало или поднялось,
# бот @AnimeLifeAuth_bot пишет администратору сайта в Telegram (аккаунт с меткой admin, вошедший через Telegram,
# или чат из секрета TELEGRAM_ADMIN_CHAT_ID). Состояние прошлой проверки переносится кэшем (.health/state.json),
# поэтому сообщения приходят только при изменениях. Там же порог лимита Worker (70k и 90k вызовов за сутки).
# Сайт или каталог лёг — запуск красный, GitHub пришлёт письмо.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
      APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
      KODIK_TOKEN: ${{ secrets.VITE_KODIK_TOKEN }}
      # Вызовы Worker за сутки: на 70 и 90 тысячах из 100 000 бот предупреждает администратора.
      CLOUDFLARE_EMAIL: ${{ secrets.ANIMELIFE_CF_EMAIL }}
      CLOUDFLARE_API_KEY: ${{ secrets.ANIMELIFE_CF_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache/restore@v4
        with:
          path: .health
          key: health-${{ github.run_id }}
          restore-keys: health-
      - name: Проверить сайт и источники
        run: node scripts/source-health.mjs
      - if: always() && hashFiles('.health/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .health
          key: health-${{ github.run_id }}-${{ github.run_attempt }}
