name: Функции Appwrite (выкл.)

# Prod на AnimeLife Core (D1/Worker). Деплой Appwrite Functions больше не нужен —
# community / social-login живут в worker/core. Workflow оставлен как заглушка,
# чтобы случайный push в functions/** не пытался выложить устаревший бэкенд.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Введите RETIRED — workflow ничего не деплоит'
        required: true

permissions:
  contents: read

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Appwrite Functions retired
        run: |
          echo "::notice::Сайт на Core (/api/core). Функции Appwrite не публикуем."
          if [ "${{ inputs.confirm }}" != "RETIRED" ]; then
            echo "::error::Для подтверждения введите RETIRED (деплоя всё равно нет)."
            exit 1
          fi
