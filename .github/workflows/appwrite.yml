name: Функции Appwrite

# Выкладывает серверную функцию community (отзывы, комментарии, жалобы, совместный просмотр) в Appwrite,
# когда её код меняется в main. Ключ Appwrite берётся только из секрета APPWRITE_API_KEY и в сайт не попадает.
on:
  push:
    branches: [main]
    paths: ['functions/community/**', 'scripts/deploy-function.mjs', 'scripts/set-function-var.mjs', 'scripts/telegram-test.mjs', '.github/workflows/appwrite.yml']
  workflow_dispatch:
    inputs:
      telegram_test_chat:
        description: 'ID чата Telegram для тестового уведомления о серии (пусто — не отправлять)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: appwrite
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
    steps:
      - name: Проверить ключ Appwrite
        id: keys
        run: |
          if [ -n "$APPWRITE_API_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Секрет APPWRITE_API_KEY не задан, функция не выложена."
          fi
      - if: steps.keys.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.keys.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # Колонки для жалоб на комментарии. Скрипт пропускает то, что уже есть.
      - if: steps.keys.outputs.ok == 'true'
        name: Подготовить таблицы
        run: node functions/community/setup-comment-reports.mjs
      - if: steps.keys.outputs.ok == 'true'
        name: Подготовить общий чат
        run: node functions/community/setup-community-chat.mjs
      # Закрытые таблицы статистики для админа (/admin/analytics). Скрипт пропускает то, что уже есть.
      - if: steps.keys.outputs.ok == 'true'
        name: Подготовить таблицы статистики
        run: node functions/community/setup-analytics.mjs
      # Токен бота для уведомлений в Telegram: из секрета TELEGRAM_BOT_TOKEN или, если его нет, из функции входа.
      - if: steps.keys.outputs.ok == 'true'
        name: Токен Telegram-бота
        continue-on-error: true
        env:
          VAR_VALUE: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node scripts/set-function-var.mjs community TELEGRAM_BOT_TOKEN --from social-login
      - if: steps.keys.outputs.ok == 'true'
        name: Выложить функцию community
        run: node scripts/deploy-function.mjs community
      - if: steps.keys.outputs.ok == 'true' && inputs.telegram_test_chat != ''
        name: Тестовое уведомление в Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ inputs.telegram_test_chat }}
        run: node scripts/telegram-test.mjs "$CHAT"
